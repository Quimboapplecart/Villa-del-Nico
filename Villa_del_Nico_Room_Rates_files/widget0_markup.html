<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8" /><title></title></head><body><font size="2" face="Abadi MT Condensed Light"><div style="color: #e26410;" id="DT"> </div><script type="text/javascript">var weekday=new Array(7);weekday[0]="Sunday";weekday[1]="Monday";weekday[2]="Tuesday";weekday[3]="Wednesday";weekday[4]="Thursday";weekday[5]="Friday";weekday[6]="Saturday";function updateDT() {var today = new Date();MDY = (1 + today.getMonth()) + '-' + today.getDate() + "-" + (1900 + today.getYear()) ;HR = today.getHours();if (HR <= 9) { HR = "0" + HR }MIN = today.getMinutes();if (MIN <= 9) {MIN = "0" + MIN}SEC = today.getSeconds();if (SEC <= 9) { SEC = "0" + SEC }document.getElementById("DT").innerHTML = (weekday[today.getDay()] + "," + " " +  MDY + " ");}tick = setInterval('updateDT()', 1000);</script> </font></body></html>
